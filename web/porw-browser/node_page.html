<!doctype html>
<meta charset="utf-8">
<title>PoRW browser node — full loop</title>
<script type="importmap">
{ "imports": { "@noble/hashes/": "./node_modules/@noble/hashes/", "@noble/secp256k1": "./node_modules/@noble/secp256k1/index.js" } }
</script>
<pre id="log">loading…</pre>
<script type="module">
import { loadKernel } from "./porw.js";
import { createPool } from "./pool.js";
import { PorwNode } from "./node.js";
import { hex } from "./verify.js";
import { RelayClient } from "./relay_client.js";
import { NodeService } from "./node_service.js";
import * as E from "./eip712.js";
const log = (s) => { document.getElementById("log").textContent += "\n" + s; };
const q = new URLSearchParams(location.search);
const steps = Number(q.get("steps") || 2);
const workers = Number(q.get("workers") || 0);
try {
  const t0 = performance.now();
  const payload = new Uint8Array(await (await fetch("/payload.bin")).arrayBuffer());
  const fetchMs = performance.now() - t0;
  let pool = null, kernel;
  if (workers > 0) { if (!crossOriginIsolated) throw new Error("workers need cross-origin isolation (COOP/COEP)");
    pool = await createPool({ wasmBytes: await (await fetch("./porw-shared.wasm")).arrayBuffer(), workers }); kernel = pool.kernel; }
  else kernel = await loadKernel("./sketch.wasm");
  // wallet mode (?wallet=1&chain=31337&cm=0x..&market=0x..&registry=0x..): the injected wallet (EIP-1193) signs ONE
  // EIP-712 Delegation for this tab's ephemeral session key; claims and results are then typed data signed by the session key
  let domains = null, delegation = null, walletAddr = null;
  if (q.get("wallet") === "1") {
    if (!window.ethereum) throw new Error("no injected wallet");
    const w = E.injectedWallet(window.ethereum); walletAddr = await w.connect(); const chainId = Number(q.get("chain") || w.chainId);
    domains = { claimManager: E.domain(chainId, q.get("cm")), market: E.domain(chainId, q.get("market")), registry: E.domain(chainId, q.get("registry")) };
    const session = (await import("./claim.js")).keypair(null); // fresh ephemeral key for this tab
    delegation = await E.makeDelegation(w, domains.registry, hex(session.address), Number(q.get("expiry") || 100000));
    window.__session = session; log(`wallet ${walletAddr} delegated session key ${hex(session.address)} (expiry block ${delegation.expiry})`);
  }
  const node = new PorwNode(kernel, { privHex: window.__session ? "0x" + Array.from(window.__session.priv, (b) => b.toString(16).padStart(2, "0")).join("") : "0x" + "33".repeat(32), pool, domains, delegation });
  const st = await node.loadModel(q.get("name") || "flywire-female", payload, { maxSteps: steps }); // exec kind follows the payload version (v2 -> int-lif)
  log(`payload ${payload.length} B fetched in ${fetchMs.toFixed(0)} ms; ${st.nTiles} tiles; weights leaves + model id in ${st.leavesMs.toFixed(0)} ms`);
  // optional stage-1 relay transport: ?relays=ws://a,ws://b — announce the claim and serve audits/tasks from the tab
  const relays = (q.get("relays") || "").split(",").filter(Boolean); let svc = null, rc = null;
  if (relays.length) { rc = new RelayClient(relays, node.key); const nOpen = await rc.connect(); svc = new NodeService(node, rc); svc.serve(st.mep.mepId); log(`relay: connected to ${nOpen}/${relays.length}`); }
  window.porwNode = {
    announce: async (chHex) => { const { r, env } = await svc.announce(st.mep.mepId, Uint8Array.from(chHex.match(/../g).map((h) => parseInt(h, 16)))); return { claimHash: hex(r.claimHash), envId: env.sig.slice(0, 18), served: svc.served, relayStats: { received: rc.received, duplicates: rc.duplicates, rejected: rc.rejected } }; },
    served: () => (svc ? { ...svc.served, address: rc.address } : null),
    wallet: () => ({ wallet: walletAddr, session: hex(node.key.address), delegation }),
    info: () => ({ nTiles: st.nTiles, neurons: st.hdr.neurons, synapses: st.hdr.synapses, modelId: hex(st.modelId), mepId: hex(st.mep.mepId),
                   steps, exec: st.exec, fetchMs, leavesMs: st.leavesMs, backend: node.k.backend, hc: navigator.hardwareConcurrency, workers, iso: crossOriginIsolated, sorted: st.csr.sorted }),
    challenge: async (chHex, seed) => { const r = await node.challenge(st.mep.mepId, Uint8Array.from(chHex.match(/../g).map((h) => parseInt(h, 16))), { steps, commitStride: st.exec === "lif" ? Math.min(10, steps) : 1, stimulusSeed: seed });
      const c = r.claim; return { claim: { schemeDigest: hex(c.schemeDigest), mepId: hex(c.mepId), modelId: hex(c.modelId), partialsRoot: hex(c.partialsRoot),
        coverageBytes: c.coverageBytes, challenge: hex(c.challenge), deviceId: hex(c.deviceId) },
        claimHash: hex(r.claimHash), digest: hex(r.digest), signature: hex(r.signature), address: hex(r.address), delegation: r.delegation, timings: r.timings,
        result: { execDigest: hex(r.result.execDigest), execRoot: hex(r.result.execRoot), initStateRoot: r.result.initStateRoot ? hex(r.result.initStateRoot) : null, stimulated: r.result.stimulated } }; },
    open: (t) => { const o = node.open(st.mep.mepId, t); return { tileIdx: o.tileIdx, position: o.position, tile: hex(o.tile), sketch: o.sketch,
      partialsProof: o.partialsProof.map(hex), weightsProof: o.weightsProof.map(hex) }; },
  };
  window.__ready = true;
} catch (err) { window.__error = String(err && err.stack || err); log("ERROR " + window.__error); }
</script>
