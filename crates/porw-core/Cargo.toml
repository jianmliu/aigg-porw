[package]
name = "aigg-porw-core"
description = "Chain-neutral Proof-of-Resident-Weights (PoRW) research primitives and reference verification"
license = "0BSD"
version = "0.1.0"
authors = ["Jianming Liu <liujm06@gmail.com>"]
edition.workspace = true
repository = "https://github.com/jianmliu/aigg-porw"
readme = "README.md"
include = [
    "/src",
    "/Cargo.toml",
    "/LICENSE-0BSD",
    "/README.md",
]

[lib]
bench = false

[dependencies]
blake3.workspace = true
parity-scale-codec = { workspace = true, features = ["derive"], optional = true }
scale-info = { workspace = true, features = ["derive"], optional = true }

[features]
default = ["std"]
std = [
    "blake3/std",
    "parity-scale-codec?/std",
    "scale-info?/std",
]
scale = ["dep:parity-scale-codec", "dep:scale-info"]
