[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.33"
evm_version = "london"
optimizer = true
optimizer_runs = 200
via_ir = true
# staging layout inside aigg-porw: the neutral contracts and forge-std come from the parent checkout.
# split.sh rewrites these to lib/aigg-porw/... and lib/forge-std/... and drops allow_paths.
allow_paths = ["../../../contracts/evm"]
remappings = [
  "forge-std/=../../../contracts/evm/lib/forge-std/src/",
  "aigg-porw/=../../../contracts/evm/src/",
]
